# Worked claims for forge-attest v1.4.0, with live queue checks disabled.
producer_repo = "https://github.com/crossecute/forge-attest-example-safe-ops"
producer_commit = "cd75db7acc7286d70ddfd3b76659fcd143ab14f1"
producer_setup = ""

[[run]]
script = "script/BuildSafeTx.s.sol:BuildSafeTx"

[run.defaults]
input_format = "safe-tx"
safe_version = "1.3.0"

[[run.claim]]
output_path = "out/safe-tx.json"
chain_id = "1"
safe_address = "0x111CEEee040739fD91D29C34C33E6B3E112F2177"
safe_nonce = "42"
safe_network = ""
expected_output_sha256 = "f8b05de9d16a5248543d266aedbd64b1275fd5165a111ccfe430f3c8ff415cd0"
expected_canonical_sha256 = "9057b9be885254f9dd33b26d85d42f9cdc10b1010d66e2046fb8bf747cd1c073"
expected_safe_tx_hash = "0xd0e33f3b88aceb5122db6ad935c1d709c7602f8ed92fc6b27bdd507902bdf534"

[[run]]
script = "script/BuildSafeBatch.s.sol:BuildSafeBatch"

[run.defaults]
input_format = "tx-builder"
