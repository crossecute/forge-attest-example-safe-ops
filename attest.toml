# Worked claims for forge-attest v1.2.0, with live queue checks disabled.
producer_repo = "https://github.com/crossecute/forge-attest-example-safe-ops"
producer_commit = "6bfc8446017e2da9302ce0b69af2eec600e12928"
producer_setup = ""

[[run]]
script = "script/BuildSafeTx.s.sol:BuildSafeTx"

[run.defaults]
input_format = "safe-tx"
safe_version = "1.3.0"

[[run.claim]]
output_path = "out/safe-tx.json"
chain_id = "1"
safe_address = "0x111CEEee040739fD91D29C34C33E6B3E112F2177"
safe_nonce = "42"
safe_network = ""
expected_output_sha256 = "f8b05de9d16a5248543d266aedbd64b1275fd5165a111ccfe430f3c8ff415cd0"
expected_canonical_sha256 = "9057b9be885254f9dd33b26d85d42f9cdc10b1010d66e2046fb8bf747cd1c073"
expected_safe_tx_hash = "0xd0e33f3b88aceb5122db6ad935c1d709c7602f8ed92fc6b27bdd507902bdf534"

[[run]]
script = "script/BuildSafeBatch.s.sol:BuildSafeBatch"

[run.defaults]
input_format = "tx-builder"
batch_mode = "auto"
safe_version = "1.3.0"

[[run.claim]]
output_path = "out/safe-batch.json"
chain_id = "1"
safe_address = "0x111CEEee040739fD91D29C34C33E6B3E112F2177"
safe_nonce = "43"
safe_network = ""
# createdAt changes between runs; only the canonical form is byte-stable.
expected_output_sha256 = ""
expected_canonical_sha256 = "3e04aa55c436e16cae1ce12e2c43922536ce1a1dfad9d6041c874ad382768efd"
expected_safe_tx_hash = "0x7f9d67d21eabf50afc3c0ef625d519918b4ca7037730caa7544576e12ad0c115"
