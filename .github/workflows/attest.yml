name: Attest examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: crossecute/forge-attest@9e76385ac2f96f171ceb9391cf9e8298e2d408cf # v1.4.0
        with:
          config: attest.toml
      - name: Check out the pinned verifier for feature checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crossecute/forge-attest
          ref: 9e76385ac2f96f171ceb9391cf9e8298e2d408cf # v1.4.0
          path: .forge-attest
          persist-credentials: false
      - name: Test producer formats and rejection cases
        run: bash test/features.sh .forge-attest

  attest-zeus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crossecute/forge-attest@9e76385ac2f96f171ceb9391cf9e8298e2d408cf # v1.4.0
        env:
          MAINNET_RPC_URL: https://eth.drpc.org
        with:
          config: attest.zeus.toml
          foundry-version: v1.8.1
          require-live: "true"
