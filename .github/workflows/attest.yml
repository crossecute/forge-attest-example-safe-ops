name: Attest examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: crossecute/forge-attest@09b0c9b69f1b779ffb5938899775f93d2e423528 # v1.3.0
        with:
          config: attest.toml
      - name: Check out the pinned verifier for feature checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crossecute/forge-attest
          ref: 09b0c9b69f1b779ffb5938899775f93d2e423528 # v1.3.0
          path: .forge-attest
          persist-credentials: false
      - name: Test producer formats and rejection cases
        run: bash test/features.sh .forge-attest
